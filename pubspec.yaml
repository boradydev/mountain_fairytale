name: mountain_fairytale
description: "Система автоматизации службы доставки воды."
publish_to: 'none'

# ==========================================
# AI CONTEXT & ARCHITECTURE CONSTRAINTS
# ==========================================
# DOMAIN: Water Delivery & Logistics ERP
# CORE FEATURES:
#   - Route management with printable PDF forms (using pdf/printing/pdfrx)
#   - Pickup (self-delivery) order processing
#   - Financials: Commission/reward calculation for Sales Reps & Managers
#   - Analytics: Customer churn detection & retention ("sleeping" clients)
# TECH STACK:
#   - TARGET FLUTTER VERSION: Flutter 3.13.x (Dart 3.1.x compatible)
#   - TARGET PLATFORMS: Windows Desktop (Primary erp-style app)
#   - STATE MANAGEMENT: Provider (^6.1.5)
#   - CODE GENERATION: Active (build_runner, json_serializable)
# ==========================================

version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: ^3.47.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.5+1

  # Desktop Specific Plugins
  window_manager: ^0.5.1
  desktop_drop: ^0.7.1

  # Data Parsing & Utilities
  shared_preferences: ^2.5.5
  json_annotation: ^4.12.0
  intl: any

  # Files, PDF & Printing
  file_picker: ^11.0.2
  pdf: ^3.11.3
  printing: ^5.14.2
  pdfrx: ^2.6.5

  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation Tools
  json_serializable: ^6.14.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true # AI Note: Keeps synthetic localization/assets files auto-generated

  assets:
    # Demo data structures
    - assets/demo/delivery_days/
    - assets/demo/clients/
    - assets/demo/cars/
    - assets/demo/products/
    - assets/demo/delivery_routes/
    - assets/demo/driver/
    - assets/demo/payment_methods/
    - assets/demo/sales_representatives/
    - assets/demo/sales_representative_commissions/
    - assets/demo/pickup/
    - assets/demo/sales_representative_clients/
    # Application fonts
    - assets/fonts/
